# Сценарий диалога. Под каждого клиента меняется только этот файл.
#
# Типы шагов: text, phone, email, number, choice
# Поля шага:
#   id        — как поле называется внутри (латиницей, уникально)
#   label     — как поле назовётся в заявке и в выгрузке
#   question  — что спросит бот
#   type      — тип ответа, по умолчанию text
#   options   — варианты, только для type: choice
#   required  — false делает шаг необязательным
#   error     — своё сообщение при неверном ответе

greeting: |
  Здравствуйте! Это бот мастерской «Пример».
  Задам несколько коротких вопросов и передам заявку мастеру.
  Если передумаете — наберите /cancel.

completion: |
  Спасибо, заявка принята.
  Мастер перезвонит в рабочее время: будни с 10:00 до 19:00.

cancelled: Заявка отменена. Наберите /start, если захотите вернуться.

steps:
  - id: name
    label: Имя
    question: Как к вам обращаться?

  - id: phone
    label: Телефон
    type: phone
    question: По какому номеру перезвонить?
    error: "Не похоже на номер. Напишите так: +7 916 123-45-67"

  - id: device
    label: Техника
    type: choice
    question: С чем нужна помощь?
    options:
      - Ноутбук
      - Телефон
      - Планшет
      - Другое

  - id: problem
    label: Проблема
    question: Опишите, что случилось.

  - id: urgency
    label: Срочность
    type: choice
    question: Насколько срочно?
    options:
      - Сегодня
      - На этой неделе
      - Не горит

  - id: comment
    label: Комментарий
    required: false
    question: Что-то ещё, что нам стоит знать?
