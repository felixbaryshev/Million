[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenomics"
version = "0.1.0"
description = "Measure and cut what your Claude API traffic costs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Only needed for exact counts via the count_tokens endpoint.
api = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
tokenomics = "tokenomics.cli:main"

[tool.setuptools.packages.find]
include = ["tokenomics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
